<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Central Heating</title>
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" href="/icons/icon-192.png" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  <meta name="theme-color" content="#0b1220" />
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0;
      min-height: 100vh;
      background: #0b1220;
      color: #eef1f6;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    main {
      width: 100%;
      max-width: 360px;
      padding: 24px;
      text-align: center;
    }
    h1 { font-size: 18px; font-weight: 600; color: #9aa4b5; margin: 0 0 24px; }
    #state { font-size: 28px; font-weight: 700; margin-bottom: 8px; }
    #last-heard { font-size: 13px; color: #9aa4b5; margin-bottom: 32px; }
    .buttons { display: flex; gap: 12px; }
    button {
      flex: 1;
      padding: 16px;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }
    #boost { background: #ff7a1a; color: #0b1220; }
    #cancel { background: #1a2333; color: #eef1f6; }
    #error { margin-top: 16px; font-size: 13px; color: #ff6b6b; min-height: 1em; }
    #key-setup p { color: #9aa4b5; font-size: 14px; margin-bottom: 16px; }
    #key-input {
      width: 100%;
      box-sizing: border-box;
      padding: 14px;
      margin-bottom: 12px;
      border-radius: 12px;
      border: 1px solid #2a3548;
      background: #131c2e;
      color: #eef1f6;
      font-size: 16px;
    }
    #key-save { width: 100%; background: #ff7a1a; color: #0b1220; }
    #key-error { margin-top: 12px; font-size: 13px; color: #ff6b6b; min-height: 1em; }
    .link {
      margin-top: 20px;
      background: none;
      color: #9aa4b5;
      font-size: 13px;
      font-weight: 400;
      text-decoration: underline;
      padding: 4px;
    }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main>
    <h1>Central Heating</h1>

    <section id="key-setup" hidden>
      <p>Enter the app API key to connect to the house.</p>
      <input id="key-input" type="text" placeholder="API key" autocomplete="off" autocapitalize="off" spellcheck="false" />
      <button id="key-save">Save</button>
      <div id="key-error"></div>
    </section>

    <section id="dashboard" hidden>
      <div id="state">…</div>
      <div id="last-heard"></div>
      <div class="buttons">
        <button id="boost">Boost hot water</button>
        <button id="cancel">Cancel</button>
      </div>
      <div id="error"></div>
      <button id="change-key" class="link">Change API key</button>
    </section>
  </main>
  <script src="/app.js"></script>
</body>
</html>
