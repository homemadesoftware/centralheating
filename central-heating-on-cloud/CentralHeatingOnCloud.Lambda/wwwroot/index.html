<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Central Heating</title>
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" href="/icons/icon-192.png" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  <meta name="theme-color" content="#0b1220" />
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0;
      min-height: 100vh;
      background: #0b1220;
      color: #eef1f6;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    main {
      width: 100%;
      max-width: 360px;
      padding: 24px;
      text-align: center;
    }
    h1 { font-size: 18px; font-weight: 600; color: #9aa4b5; margin: 0 0 24px; }
    #state { font-size: 28px; font-weight: 700; margin-bottom: 8px; }
    #last-heard { font-size: 13px; color: #9aa4b5; margin-bottom: 32px; }
    .buttons { display: flex; gap: 12px; }
    button {
      flex: 1;
      padding: 16px;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }
    #boost { background: #ff7a1a; color: #0b1220; }
    #cancel { background: #1a2333; color: #eef1f6; }
    #error { margin-top: 16px; font-size: 13px; color: #ff6b6b; min-height: 1em; }
  </style>
</head>
<body>
  <main>
    <h1>Central Heating</h1>
    <div id="state">…</div>
    <div id="last-heard"></div>
    <div class="buttons">
      <button id="boost">Boost hot water</button>
      <button id="cancel">Cancel</button>
    </div>
    <div id="error"></div>
  </main>
  <script src="/app.js"></script>
</body>
</html>
