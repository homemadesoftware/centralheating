name: Create bug tracking issues

on:
  push:
    branches:
      - 'copilot/fix-date-time-bugs'

jobs:
  create-issues:
    if: "contains(github.event.head_commit.message, 'chore: create bug tracking issues')"
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@v4
      - name: Create issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: python3 .github/scripts/create-issues.py
