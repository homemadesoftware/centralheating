name: Create bug tracking issues

on:
  push:
    branches:
      - 'copilot/fix-date-time-bugs'

jobs:
  create-issues:
    if: contains(github.event.head_commit.message, 'chore: create bug tracking issues')
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Create issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          # Helper: create issue only if it doesn't already exist
          create_issue() {
            local title="$1"
            local body="$2"
            local labels="$3"
            if gh issue list --repo "$REPO" --state open --search "in:title $title" --json title -q '.[].title' | grep -qF "$title"; then
              echo "Issue already exists: $title"
            else
              gh issue create --repo "$REPO" --title "$title" --body "$body" ${labels:+--label "$labels"}
              echo "Created: $title"
            fi
          }

          create_issue \
            "Bug: August wrongly returns 30 days in DateTime.c" \
            "## Description

In \`Common/DateTime.c\`, the \`case 8\` branch (August) returns 30 days instead of the correct 31.

\`\`\`c
case 8 :   // Aug
    return 30;  // BUG: August has 31 days
\`\`\`

## Impact

- Date rollover in \`AddSecondsToDateTime\` is wrong for any transition that crosses the end of August.
- The \"Day+\" upper-bound check in \`HandleMenuCommand\` will allow day 31 to be set in August, but the stored date will behave incorrectly when used for scheduling.

## Fix

Change the return value from \`30\` to \`31\` for \`case 8\`." \
            "bug"

          create_issue \
            "Bug: Month rollover off-by-one in AddSecondsToDateTime" \
            "## Description

In \`Common/DateTime.c\`, the month rollover check uses \`>= 12\` instead of \`> 12\`:

\`\`\`c
if (result->month >= 12)   // BUG: should be > 12
\`\`\`

Month 12 is December. With \`>= 12\`, any time addition that causes the month to land on December immediately wraps to January of the next year, making it impossible to represent any time in December.

## Fix

Change the condition to \`> 12\`." \
            "bug"

          create_issue \
            "Bug: Wrong bit set when writing hours in RTC1307.c (24-hour mode)" \
            "## Description

In \`pico-central-heating/RTC1307.c\`, the hours register write clears bit 7 and then immediately sets it back:

\`\`\`c
buffer[3] = (EncodeAsBcd(dateTime->hours) & 0x7F) | 0x80; // 24 hour
\`\`\`

The DS1307 hours register layout:
- **Bit 6** is the 12/24-hour select (0 = 24-hour mode)
- **Bit 7** is unused and must be 0

Setting bit 7 violates the datasheet. The comment says \"24 hour\" but that refers to bit 6, not bit 7. The code accidentally works today because BCD-encoded hours 0–23 never set bit 6, so the 12/24-hour select bit stays 0. However, it is non-compliant and fragile.

## Fix

Replace \`& 0x7F | 0x80\` with \`& 0x3F\` to clear both bit 6 (forcing 24-hour mode) and bit 7 (keeping the reserved bit clear)." \
            "bug"

          create_issue \
            "Bug: malloc result not checked in Display.c" \
            "## Description

In \`pico-central-heating/Display.c\`, the result of \`malloc\` is not checked for \`NULL\`:

\`\`\`c
imageBuffer = (unsigned char*)malloc(imageSize);
// No NULL check here
\`\`\`

The equivalent code in \`main.c\` correctly checks for allocation failure. On the Pico, heap space is limited; if the allocation fails, subsequent \`Paint_NewImage\` / display calls will dereference a null pointer and crash.

## Fix

Add a null check after \`malloc\` and handle the error (e.g., log a fault and halt, or return an error code), matching the pattern already used in \`main.c\`." \
            "bug"

          create_issue \
            "Bug: Hardware_EnableTimer matches empty slots via cookie == 0 sentinel" \
            "## Description

In \`pico-central-heating/PicoEntryPoint.c\`, \`Hardware_EnableTimer\` uses:

\`\`\`c
if (timers[i].cookie == 0 || timers[i].cookie == cookie)
\`\`\`

Cookie \`0\` is the \"empty slot\" sentinel. This condition will match an unregistered (empty) slot and enable it with no callback set. When the timer fires it will invoke a null function pointer, causing a hard fault.

\`Hardware_RegisterForTimer\` uses the same pattern intentionally (to find an empty slot to fill). \`EnableTimer\` should only ever match an already-registered cookie.

## Fix

Remove the \`timers[i].cookie == 0\` condition from \`Hardware_EnableTimer\`, leaving only \`timers[i].cookie == cookie\`." \
            "bug"

          create_issue \
            "Dead code: main.c Waveshare demo coexists with production entry point" \
            "## Description

\`main.c\` is a Waveshare ePaper bring-up demo (\"Ali is cool\"). It is excluded from the build by a \`#main.c\` comment in \`CMakeLists.txt\`. It contains its own \`main()\` and \`check_reboot_button()\`, whose signature is forward-declared (but never called) in \`PicoEntryPoint.c\`. This creates confusion about which entry point is authoritative.

## Fix

Either delete \`main.c\` or move it to an \`Archive/\` directory to make clear it is not production code." \
            "dead code"

          create_issue \
            "Dead code: Reboot button never launched in PicoEntryPoint.c" \
            "## Description

In \`pico-central-heating/PicoEntryPoint.c\`, \`check_reboot_button\` is forward-declared at the top of the file, but \`multicore_launch_core1(check_reboot_button)\` is never called. The reboot-button feature from \`main.c\` was never wired into the real entry point.

## Fix

Either wire up the reboot button by adding \`multicore_launch_core1(check_reboot_button);\` in the appropriate place, or remove the forward declaration if the feature is not needed." \
            "dead code"
