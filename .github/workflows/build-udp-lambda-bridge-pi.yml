name: Build udp-lambda-bridge-pi

on:
  push:
    branches: [master]
    paths:
      - "udp-lambda-bridge/**"
      - ".github/workflows/build-udp-lambda-bridge-pi.yml"
  pull_request:
    paths:
      - "udp-lambda-bridge/**"
      - ".github/workflows/build-udp-lambda-bridge-pi.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y cmake libcurl4-openssl-dev

      # Native compile-check, not a real ARMv6 cross-build — this only
      # catches compile errors early. The real target build happens on
      # toadmail-hub itself, via udp-lambda-bridge/build-pi.ps1 (see
      # that project's README, "Build setup"). Uses the same
      # CMakeLists.txt as that script, so CI and the real build can't
      # quietly drift apart into two different build definitions.
      - name: Compile-check
        run: |
          cd udp-lambda-bridge
          cmake -S . -B build
          cmake --build build
